services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_attendance
      TZ: Asia/Dhaka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7788:7788"
    environment:
      DATABASE_URL: postgresql://prime:prime_secret@postgres:5432/prime_attendance
      PORT: 7788
      JWT_SECRET: ${JWT_SECRET:-prime-attendance-jwt-secret-32chars!!}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@primetechbd.xyz}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin@12345}
      TZ: Asia/Dhaka
      ERPNEXT_ENABLED: ${ERPNEXT_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
