services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_attendance
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7788:7788"      # ← এটাও রাখো
    volumes:
      - ./client/dist:/app/client/dist:ro   # ← client dist serve করার জন্য
    environment:
      DATABASE_URL: postgresql://prime:prime_secret@postgres:5432/prime_attendance
      PORT: 7788
      CLIENT_DIST_PATH: /app/client/dist    # ← এটা add করো
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-min-32-chars}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@primetechbd.xyz}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin@12345}
      TZ: Asia/Dhaka
      ERPNEXT_ENABLED: ${ERPNEXT_ENABLED:-false}
      ERPNEXT_URL: ${ERPNEXT_URL:-}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
